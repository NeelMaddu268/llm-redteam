[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "redteam"
version = "0.1.0"
description = "LLM prompt-injection / jailbreak evaluation harness (local-first via Ollama)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Neel Maddu", email = "neelmaddu1@gmail.com" }]
keywords = ["llm", "prompt-injection", "jailbreak", "security", "red-team", "evaluation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Intended Audience :: Developers",
]
dependencies = [
  "ollama>=0.3.0",
  "pydantic>=2.6",
  "rich>=13.7",
  "pyyaml>=6.0",
  "streamlit>=1.31",
  "altair>=5.0",
]

[project.optional-dependencies]
# Optional Anthropic target/judge — never required for the core pipeline.
anthropic = ["anthropic>=0.40"]
# Tooling for development and CI.
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
redteam = "redteam.cli:main"

[project.urls]
Homepage = "https://github.com/NeelMaddu268/llm-redteam"

[tool.setuptools.packages.find]
include = ["redteam*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Long lines are expected in payload/prompt strings; the rest of the code stays tidy.
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
